  .notice-box-header {

  /* ══════════════════════════════

    #magazine { margin: 0; padding: 0; }
    .page {
      width: 210mm;
      height: 297mm;
      margin: 0;
      break-after: page;
      page-break-after: always;
      box-shadow: none;
      overflow: hidden;
    }

      break-after: auto;
      page-break-after: auto;
    }
    .article {
      page-break-inside: avoid;
      break-inside: avoid;
      padding: 20px 0;
    }
    .art-photo {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .print-btn { display: none; }

    .articles-inner { overflow: hidden; }
    .print-btn {

      background: var(--navy);

      box-shadow: 0 4px 16px rgba(0,0,0,0.3);

    .activity-with-img.img-right,

    /* 글자 크기 */
    html { -webkit-text-size-adjust: 100%; }
    .activity-title-row h2       { font-size: 18px; }
    .activity-body p              { font-size: 13px; }
    .cover-headline-box .report-title { font-size: 26px; }

    .art-body    { font-size: 13px !important; }
    .art-subtitle { font-size: 12px !important; }

    /* 여백 */
    .content-inner  { padding: 0 14px; overflow: visible; }
    .activity-block { padding: 14px 0; overflow: visible; min-height: auto; flex: none; }

    /* 푸터 겹침 */
    .page-footer { position: relative; margin-top: 20px; }

    /* 표지 */
    .cover-content { margin-top: 100px; }

    /* 본문 페이지 고정 높이 해제 */
    .content-page { height: auto; }

<body>

<!-- 인쇄 버튼 (화면에서만 보임) -->
<button class="print-btn" onclick="handlePrint()">📥 PDF 저장</button>

<!-- 동적으로 생성됨 -->
<div id="magazine"></div>

<script>
function handlePrint() {
  if (navigator.userAgent.match(/iPhone|iPad|iPod|Android/i)) {
    alert('모바일에서는 브라우저 메뉴 → 공유 → PDF로 저장을 이용해 주세요.');
  } else {
    window.print();
  }
}

// ─── 데이터 파일 경로 ───
// 실제 사용 시 이 경로만 변경하면 됩니다
const DATA_FILE = 'data-2026-08.json';

// ─── 도트 색상 ───

// ─── 커버 파싱 (날짜 추출) ───
function parseCoverItem(item) {
  const match = item.match(/^(.*?)\s*(\(\d+\.\s*\d+(?:\s*\/\s*\d+\.\s*\d+)?\))$/);
  if (match) return { text: match[1].trim(), date: match[2] };
  return { text: item, date: '' };
}

// ─── 1면: 표지 ───
function buildCover(d) {
  const m = d.meta;
  const items = d.coverItems.map((item, i) => {
    const p = parseCoverItem(item);
    return `<li><span class="date-tag">${p.date}</span> ${p.text}</li>`;
  }).join('');

  return `<div class="page cover">
    <div class="cover-top">
      <div class="cover-logo"><img src="photos/logo.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div class="cover-top-titles">
        <div class="mag-label">MAGAZINE</div>
        <div class="cn-title">平南 猛虎出林</div>
        <div class="kr-sub">평안남도 도정보고 소식지</div>
      </div>
      <div class="cover-issue-badge">
        <div class="year-month">${m.year}.${m.issueMonth}</div>
      </div>
    </div>

    <div class="cover-hero">
      <div class="cover-content">
        <div class="cover-headline-box">
          <div class="report-label">📋 ${m.year}년 ${m.reportMonth}월 도정보고</div>
          <div class="report-title">${m.year}년 ${m.reportMonth}월<br>평남 도정보고</div>
          <div class="report-sub">${m.issueLabel}</div>
        </div>

        <div class="cover-toc-label">주요내용</div>
        <ul class="cover-toc-list">${items}</ul>
      </div>
    </div>
  </div>`;
}

// ─── 본문 페이지 빌더 ───
function buildActivityBlock(act, small) {
  const imgPos = act.imagePosition === 'left' ? 'img-left' : 'img-right';
  const imgHtml = `<div class="activity-image">
    <img src="${act.image}" alt="${act.title}" loading="lazy">
    <div class="activity-image-caption">${act.title} (${act.date})</div>
  </div>`;
  const linksHtml = act.links && act.links.length
    ? `<div class="art-links">${act.links.map(l => `<a href="${l.url}" target="_blank" class="art-link-btn">🔗 ${l.title}</a>`).join('')}</div>`
    : '';
  const bodyHtml = `<div class="activity-body"><p>${act.body}</p>${linksHtml}</div>`;

  return `<div class="activity-block">
    <div class="activity-title-row">
      <h2>${act.title}<span class="date-inline">(${act.date})</span></h2>
      ${act.subtitle ? `<div class="activity-subtitle">${act.subtitle}</div>` : ''}
    </div>
    <div class="activity-with-img ${imgPos}">
      ${act.imagePosition === 'left' ? imgHtml + bodyHtml : bodyHtml + imgHtml}
    </div>
  </div>`;
}

function buildContentPage(activities, pageNum, meta, groupLabel) {
  const blocks = activities.map(a => buildActivityBlock(a)).join('');
  return `<div class="page content-page">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="photos/logo.png" style="width:36px;height:36px;object-fit:contain;">
        <div>
          <div class="title-cn">平南 猛虎出林</div>
          <div class="title-kr" style="font-size:12px; letter-spacing:1px; color:var(--navy-mid); margin-top:2px;">평안남도 도정보고 소식지</div>
        </div>
      </div>
      <div class="issue-info">
        MAGAZINE<br>${meta.year}.${meta.issueMonth}
      </div>
    </div>
    <div class="section-label">${groupLabel} 주요 실시사항</div>
    <div class="content-inner">${blocks}</div>
    <div class="page-footer">
      <span class="copyright">Copyright. 평안남도 도지사실</span>
      <span class="page-num">${pageNum}</span>
    </div>
  </div>`;
}

// ─── 예정사항 페이지 ───
function buildUpcomingPage(d, pageNum) {
  const m = d.meta;
  const upcoming = d.upcomingItems.map((item, i) => `
    <li>
      <span class="dot dot-${i % 5}"></span>
      <span class="udate">${item.date}</span>
      <span>${item.title}</span>
    </li>`).join('');

  const noticeLines = d.notice.lines.map((line, i) => {
    // URL을 클릭 가능한 링크로 변환
    const linked = line.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
    return `<li${i < 2 ? ' class="highlight"' : ''}>${linked}</li>`;
  }).join('');

  return `<div class="page content-page">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="photos/logo.png" style="width:36px;height:36px;object-fit:contain;">
        <div class="title-cn">平南 猛虎出林</div>
      </div>
      <div class="issue-info">MAGAZINE<br>${m.year}.${m.issueMonth}</div>
    </div>
    <div class="section-label">${m.reportMonth + 1}月 주요 예정사항</div>
    <div class="upcoming-section">
      <h3>${m.reportMonth + 1}월 주요 예정사항</h3>
      <ul class="upcoming-list">${upcoming}</ul>
    </div>

    <div class="notice-box">
      <div class="notice-box-header">${d.notice.icon} ${d.notice.title}</div>
      <div class="notice-box-body">
        <ul>${noticeLines}</ul>
        ${d.notice.qrImage ? `<div class="notice-box-qr"><img src="${d.notice.qrImage}" alt="QR코드"><span>설문 참여</span></div>` : ''}
      </div>
    </div>

    <div class="page-footer">
      <span class="copyright">Copyright. 평안남도 도지사실</span>
      <span class="page-num">${pageNum}</span>
    </div>
  </div>`;
}

// ─── 월별 추진일정 페이지 ───

  const m = d.meta;

    const isCurrentMonth = (i + 1) === m.reportMonth;
    return `<tr${isCurrentMonth ? ' class="highlight-row"' : ''}>
      <th>${row.month}</th>
      <td>${row.items}</td>
    </tr>`;
  }).join('');

  return `<div class="page content-page">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="photos/logo.png" style="width:36px;height:36px;object-fit:contain;">
        <div class="title-cn">平南 猛虎出林</div>
      </div>
      <div class="issue-info">MAGAZINE<br>${m.year}.${m.issueMonth}</div>
    </div>
    <div class="schedule-page">
      <h3>${m.year}년 평안남도 월별 추진일정</h3>
      <table class="schedule-table">
        <colgroup><col width="60"><col></colgroup>
        <thead><tr><th>월</th><th>내 용</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="page-footer">
      <span class="copyright">Copyright. 평안남도 도지사실</span>
      <span class="page-num">${pageNum}</span>
    </div>
  </div>`;
}

// ─── 전체 소식지 조립 ───
async function buildMagazine() {
  let data;
  try {
    const res = await fetch(DATA_FILE + '?v=' + Date.now());
    data = await res.json();
  } catch(e) {
    // fetch 실패시 (파일 직접 열기) 내장 샘플 사용
    console.warn('JSON fetch 실패 - 내장 데이터 사용:', e.message);
    data = INLINE_DATA;
  }

  const mag = document.getElementById('magazine');
  data.activities.sort((a, b) => (b.priority || 0) - (a.priority || 0));
  // 정렬 후 imagePosition 재할당 — 항상 right/left 번갈아가며 표시
  data.activities.forEach((a, i) => { a.imagePosition = i % 2 === 0 ? 'right' : 'left'; });
  const acts = data.activities;
  const m = data.meta;

  // 1면: 표지
  mag.innerHTML += buildCover(data);

  // 본문: 2개씩 묶어서 페이지 생성
  const pageSize = 3;
  let pageNum = 1;
  for (let i = 0; i < acts.length; i += pageSize) {
    const slice = acts.slice(i, i + pageSize);
    const label = `${m.reportMonth}月`;
    mag.innerHTML += buildContentPage(slice, `${pageNum}-${Math.ceil(acts.length/pageSize)}`, m, label);
    pageNum++;
  }

  // 예정사항 페이지
  mag.innerHTML += buildUpcomingPage(data, `예정`);

  // 뒷표지
  mag.innerHTML += buildBackCover(data);

  // 16개시군 마무리 페이지
  mag.innerHTML += buildCitiesPage();
}

실향민축제.jpeg","imagePosition":"right"},{"id":4,"title":"국악신문 인터뷰","date":"6. 13","subtitle":"국악신문, 도정 철학을 듣다","body":"정경조 평안남도지사는 6월 13일 오후 4시 도지사실에서 국악신문과의 단독 인터뷰를 가졌다. 이번 인터뷰는 평안남도의 전통문화 계승 의지와 도정 철학을 외부 언론을 통해 널리 알리는 자리로 마련됐다. 정경조 지사는 국악을 비롯한 우리 전통 예술이 도민 공동체 정신을 하나로 묶는 소중한 문화유산임을 강조하며, 평안남도가 전통문화의 보존과 진흥에 앞장서 나갈 것임을 밝혔다. 또한 전통 예술의 대중화와 후계 인재 양성을 통해 남북이 공유하는 문화적 뿌리를 더욱 굳건히 다지고, 통일 시대를 준비하는 문화 기반을 착실히 구축해 나가겠다는 뜻을 밝혔다.","priority":5,"image":"photos/2026-07/평남logo.png","imagePosition":"left"},{"id":5,"title":"예비역 장군 방문","date":"6. 13","subtitle":"예비역 장군단, 도청 방문","body":"정경조 평안남도지사는 2026년 6월 13일 오전 11시 도청 소회의실에서 예비역 장군단의 방문을 맞아 면담을 가졌다. 이번 방문은 평안남도의 안보 현황과 도정 방향을 공유하고, 군 원로들의 경험과 식견을 도정에 접목하기 위해 마련되었다. 정경조 지사는 예비역 장군들과 한반도 안보 환경 및 통일 준비와 관련한 심도 있는 의견을 나누며, 군 원로들이 축적한 국방 경험이 평안남도의 통일 기반 구축과 도민 안전을 위한 든든한 자산이 될 것이라고 밝혔다. 정경조 지사는 앞으로도 예비역 원로들과의 소통과 협력을 지속적으로 이어가며 통일을 향한 도정의 역할을 충실히 수행해 나가겠다는 뜻을 밝혔다.","priority":3,"image":"photos/2026-07/예비역장군.jpeg","imagePosition":"right"},{"id":6,"title":"위원회 간담회","date":"6. 13","subtitle":"위원회 간담회 개최","body":"정경조 평안남도지사는 6월 13일 오후 2시 도청 소회의실에서 위원회 간담회를 개최했다. 이번 간담회는 도정 현안에 대한 위원회의 의견을 수렴하고 상호 소통을 강화하기 위해 마련됐다. 정경조 지사는 위원들과 함께 도민 화합과 공동체 발전을 위한 다양한 과제를 논의하며, 위원회와의 긴밀한 협력 체계를 더욱 공고히 해 나갈 필요성을 강조했다. 아울러 도정의 주요 시책이 도민의 삶에 실질적으로 반영될 수 있도록 위원회의 적극적인 역할과 지속적인 소통을 당부하며, 앞으로도 열린 자세로 현장의 목소리에 귀 기울이겠다는 뜻을 밝혔다.","priority":3,"image":"photos/2026-07/이북5도위원회로고.png","imagePosition":"left"},{"id":7,"title":"명예도민증 제도 관련 도 규정화 검토","date":"6. 13","subtitle":"명예도민증 규정화 추진","body":"정경조 평안남도지사는 6월 13일 도지사실에서 명예도민증 제도의 도 규정화 방안을 집중 검토했다. 이번 검토는 평안남도와 인연을 맺은 각계 인사들에게 명예도민증을 공식 수여할 수 있는 법적·행정적 근거를 마련하기 위해 추진됐다. 명예도민증 제도가 규정화되면 평안남도의 정체성과 유대감을 확산하는 데 기여할 것으로 기대된다. 정경조 지사는 이 제도가 도민 공동체 의식을 강화하고 평안남도의 가치를 널리 알리는 동시에, 향후 통일 시대를 대비한 폭넓은 인적 네트워크 구축의 토대가 될 것이라는 뜻을 밝혔다.","priority":1,"image":"photos/2026-07/평남logo.png","imagePosition":"right"},{"id":8,"title":"명예시장·군수 월례회의","date":"6. 20","subtitle":"명예시장·군수 월례회의 개최","body":"정경조 평안남도지사는 6월 20일 도청 3층 시장·군수실에서 명예시장·군수 월례회의를 주재했다. 이번 회의는 평안남도 각 시·군을 대표하는 명예시장·군수들이 한자리에 모여 도정 현안을 공유하고 지역별 주요 과제를 논의하는 자리로 마련됐다. 참석자들은 도민 생활과 밀접한 현안들을 중심으로 활발한 의견을 교환하며 고향 발전을 위한 실질적인 방안을 모색했다. 정경조 지사는 명예시장·군수들이 지역 공동체의 구심점으로서 도민 화합과 전통 계승에 앞장서 줄 것을 당부하며, 통일을 대비한 고향 재건의 기반을 함께 다져 나가겠다는 뜻을 밝혔다.","priority":4,"image":"photos/2026-07/명예시장군수.jpeg","imagePosition":"left"},{"id":9,"title":"2026 대한민국 문화 유산 차세대 여기검대 제전","date":"6. 20","subtitle":"평양검무, 미래로 잇다","body":"정경조 평안남도지사는 6월 20일 서울 국립국악원 우면당에서 열린 '2026 대한민국 문화유산 차세대 여기검대 제전'에 참석했다. 이번 제전은 평안남도를 대표하는 전통 무예 예술인 평양검무의 맥을 잇는 차세대 전승자들이 기량을 선보이는 자리로, 임영순 보유자를 중심으로 한 평양검무 전승 계보의 위상을 널리 알리는 뜻깊은 행사로 마련됐다. 평양검무는 평안남도의 고유한 문화적 정체성을 담은 무형문화유산으로, 차세대 전승자 육성은 단순한 예술 보존을 넘어 남북이 함께 공유하는 전통문화의 뿌리를 지키는 일이기도 하다. 정경조 지사는 전통문화 계승이 도민의 자긍심을 높이고 통일 시대를 준비하는 문화적 토대가 된다는 점을 강조했다.","priority":3,"image":"photos/2026-07/평양검무.jpeg","imagePosition":"right"},{"id":10,"title":"함북 3일의 약속 전우 추모식 (강원도 철원 제23보병여단)","date":"6. 20","subtitle":"전우의 넋을 기리며 통일을 다짐","body":"정경조 평안남도지사는 6월 20일 강원도 철원 제23보병여단에서 거행된 '함북 3일의 약속 전우 추모식'에 참석했다. 이번 추모식은 한국전쟁 당시 함경북도 전선에서 산화한 전우들의 숭고한 희생을 기리기 위해 마련된 뜻깊은 자리로, 생존 참전 용사와 유가족, 각지의 도민 대표들이 한자리에 모여 고인들의 넋을 추모했다. 정경조 지사는 추모사를 통해 이들의 희생이 오늘날 우리가 고향을 향한 염원을 이어갈 수 있는 밑거름이 되었음을 강조하며, 평안남도는 전우들의 희생 정신을 도정의 근간으로 삼아 도민 화합과 통일 기반 조성에 더욱 헌신해 나가겠다는 굳은 다짐을 밝혔다.","priority":3,"image":"photos/2026-07/3사단.jpeg","imagePosition":"left"},{"title":"평안남도 6.25참전용사 감사 위안행사","date":"6. 24","subtitle":"참전용사께 감사와 위로를","body":"정경조 평안남도지사는 6월 24일 이북5도청에서 열린 평안남도 6·25참전용사 감사 위안행사에 참석했다. 이날 행사는 6·25전쟁 발발 76주년을 하루 앞두고 마련된 자리로, 목숨을 바쳐 조국을 지킨 참전용사들의 헌신과 희생에 깊은 감사를 전하기 위해 열렸다. 평안남도는 전쟁의 상흔이 가장 깊이 새겨진 고장 중 하나로, 이날 행사는 단순한 위안을 넘어 실향의 아픔을 함께 나누고 도민의 결속을 다지는 뜻깊은 시간이 됐다. 정경조 지사는 참전용사들의 숭고한 희생 위에 평화가 서 있음을 기억하며, 그 정신을 통일의 밑거름으로 계승해 나가겠다는 뜻을 밝혔다.","priority":3,"id":11,"imagePosition":"right","image":"photos/2026-07/6.25참전용사.jpeg"}],"upcomingItems":[{"date":"7. 7","title":"도지사·도민회장 간담회"},{"date":"7. 8","title":"함북도지사 이취임식"},{"date":"7. 9","title":"평남 공적심사위원회"},{"date":"7. 9","title":"함남도지사 이취임식"},{
