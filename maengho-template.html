<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平南 猛虎出林</title>
<meta property="og:title" content="平南 猛虎出林 — 2026년 8월 평안남도 도정보고">
<meta property="og:description" content="평안남도 도정보고 소식지 맹호출림 9월호 | 8월 주요 실시사항을 담았습니다.">
<meta property="og:image" content="https://myungraekim.github.io/maengho/photos/og-image.png">
<meta property="og:url" content="https://myungraekim.github.io/maengho/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="平南 猛虎出林">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --navy: #0d2340;
    --navy-mid: #1a3a5c;
    --navy-light: #2d5a8e;
    --gold: #c8a84b;
    --gold-light: #e8c96d;
    --gold-pale: #f5e9c0;
    --cream: #faf7f0;
    --text-dark: #1a1a1a;
    --text-mid: #3d3d3d;
    --text-light: #666;
    --highlight-yellow: #fff176;
    --red-accent: #8b1a1a;
    --border-light: #e0d9cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #e8e4dc;
    color: var(--text-dark);
  }

  /* ─── 공통 페이지 레이아웃 ─── */
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 8mm;
    background: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  /* ─── 공통 헤더 (2면~) ─── */
  .page-header {
    background: transparent;
    border-bottom: 1px solid rgba(13,35,64,0.15);
    padding: 6px 22px 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-header .title-kr {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--navy);
    letter-spacing: 6px;
  }
  .page-header .title-cn {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    color: var(--navy);
    letter-spacing: 3px;
    font-weight: 700;
  }
  .page-header .issue-info {
    text-align: right;
    color: var(--navy-mid);
    font-size: 11px;
    line-height: 1.6;
    font-weight: 600;
  }

  /* ─── 섹션 라벨 ─── */
  .section-label {
    background: #1a3557;
    color: var(--gold-light);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 22px 3px;
    text-transform: uppercase;
  }

  /* ─── 페이지 하단 ─── */
  .page-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--navy);
    padding: 6px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: rgba(255,255,255,0.6);
  }
  .page-footer .copyright { font-size: 10px; }
  .page-footer .page-num { font-size: 11px; color: var(--gold-light); font-weight: 700; }

  /* ══════════════════════════════
     1면: 표지
  ══════════════════════════════ */
  .cover {
    background:
      linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
      url('photos/cover-main.png') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    min-height: 297mm;
  }
  .cover-top {
    padding: 24px 22px 16px;
    border-bottom: 1px solid rgba(200,168,75,0.3);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .cover-logo {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }
  .cover-top-titles {}
  .cover-top-titles .cn-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 900;
    color: white;
    letter-spacing: 8px;
    line-height: 1;
  }
  .cover-top-titles .kr-sub {
    font-size: 12px;
    color: var(--gold-light);
    letter-spacing: 2px;
    margin-top: 4px;
  }
  .cover-top-titles .mag-label {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .cover-issue-badge {
    margin-left: auto;
    text-align: right;
  }
  .cover-issue-badge .year-month {
    font-size: 13px;
    color: var(--gold-light);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .cover-hero {
    flex: 1;
    position: relative;
    min-height: 180mm;
    display: flex;
    flex-direction: column;
  }
  .cover-bg-img {
    position: absolute;
    inset: 0;
    object-fit: cover;
    width: 100%;
    height: 100%;
    opacity: 0.25;
  }
  .cover-content {
    position: relative;
    z-index: 2;
    padding: 20px 22px 100px;
    flex: 1;
  }

  .cover-headline-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(200,168,75,0.4);
    border-left: 4px solid var(--gold);
    padding: 16px 22px;
    margin-bottom: 24px;
    backdrop-filter: blur(4px);
  }
  .cover-headline-box .report-label {
    font-size: 11px;
    color: var(--gold-light);
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .cover-headline-box .report-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 900;
    color: white;
    line-height: 1.2;
  }
  .cover-headline-box .report-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .cover-toc-label {
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cover-toc-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(200,168,75,0.4);
  }
  .cover-toc-list {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px 16px;
  }
  .cover-toc-list li {
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    padding: 5px 8px;
    background: rgba(255,255,255,0.05);
    border-left: 2px solid var(--gold);
    line-height: 1.4;
  }
  .cover-toc-list li .date-tag {
    color: var(--gold-light);
    font-weight: 700;
    font-size: 11px;
  }

  /* ══════════════════════════════
     본문 페이지: 활동 기사
  ══════════════════════════════ */
  .content-page {
    background-image:
      linear-gradient(to bottom, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.22) 18%, rgba(255,255,255,0.18) 100%),
      url('photos/content-bg.png?v=2');
    background-size: cover;
    background-position: top center;
    background-repeat: no-repeat;
    padding: 0 0 36px 0;
    display: flex;
    flex-direction: column;
    height: auto;
    min-height: auto;
  }
  .content-inner {
    padding: 0 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .activity-block {
    flex: none;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 10px 0;
    border-bottom: 2px solid var(--border-light);
    overflow: hidden;
  }
  .activity-block:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .activity-title-row {
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .activity-title-row h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--navy);
    line-height: 1.3;
    padding-bottom: 6px;
    border-bottom: 3px solid var(--red-accent);
    display: inline-block;
  }
  .activity-title-row h2 .date-inline {
    font-size: 14px;
    color: var(--gold);
    font-weight: 600;
    margin-left: 6px;
  }
  .activity-subtitle {
    font-size: 14px;
    font-weight: 700;
    font-style: italic;
    color: var(--red-accent);
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  .activity-with-img {
    display: grid;
    gap: 14px;
    align-items: start;
    flex: 1;
    min-height: 0;
  }
  .activity-with-img.img-right { grid-template-columns: 1fr 1fr; }
  .activity-with-img.img-left  { grid-template-columns: 1fr 1fr; }
  .activity-with-img.img-left .activity-body  { order: 2; }
  .activity-with-img.img-left .activity-image { order: 1; }

  .activity-body {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
  }
  .activity-body p {
    font-size: 13px;
    line-height: 1.75;
    color: var(--text-mid);
    text-align: justify;
    overflow: hidden;
  }
  .activity-image img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--border-light);
  }
  .activity-image img[src*="평안남도로고"],
  .activity-image img[src*="logo.png"] {
    object-fit: contain;
    background: var(--cream);
    padding: 24px;
    height: 200px;
  }
  .activity-image img[src*="서도소리"] {
    object-fit: contain;
    background: #1a1a1a;
    height: 200px;
  }
  .activity-image-caption {
    font-size: 10px;
    color: var(--text-light);
    text-align: center;
    padding: 4px 0;
    background: var(--cream);
    border: 1px solid var(--border-light);
    border-top: none;
  }

  /* 2단 레이아웃 (소규모 기사 2개 나란히) */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 18px 0;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-light);
  }
  .two-col .activity-title-row h2 { font-size: 15px; }
  .two-col .activity-image img { height: 120px; }
  .two-col .activity-body p { font-size: 11.5px; }

  /* ══════════════════════════════
     예정사항 페이지
  ══════════════════════════════ */
  .upcoming-section {
    padding: 16px 22px;
  }
  .upcoming-section h3 {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--gold);
    display: inline-block;
  }

  .upcoming-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .upcoming-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--cream);
    border-left: 3px solid var(--navy);
    font-size: 13px;
    color: var(--text-dark);
  }
  .upcoming-list li .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .upcoming-list li .udate {
    font-weight: 700;
    color: var(--navy);
    min-width: 40px;
    font-size: 12px;
  }

  /* 점 색상 순환 */
  .dot-0 { background: #4caf50; }
  .dot-1 { background: #ffc107; }
  .dot-2 { background: #2196f3; }
  .dot-3 { background: #9c27b0; }
  .dot-4 { background: #ff5722; }

  /* 공지 박스 */
  .notice-box {
    margin: 16px 22px;
    border: 2px solid var(--gold);
    border-radius: 4px;
    overflow: hidden;
  }
  .notice-box-header {
    background: var(--navy);
    color: var(--gold-light);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 16px;
    letter-spacing: 1px;
  }
  .notice-box-body {
    background: var(--gold-pale);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .notice-box-body ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .notice-box-qr {
    flex-shrink: 0;
    width: 90px;
    text-align: center;
  }
  .notice-box-qr img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    display: block;
    margin: 0 auto 4px;
  }
  .notice-box-qr span {
    font-size: 9px;
    color: var(--navy);
    font-weight: 700;
  }
  .notice-box-body ul li {
    font-size: 12.5px;
    color: var(--text-mid);
    padding-left: 16px;
    position: relative;
    line-height: 1.5;
  }
  .notice-box-body ul li::before {
    content: '☞';
    position: absolute;
    left: 0;
    color: var(--navy);
  }
  .notice-box-body ul li.highlight {
    font-weight: 700;
    color: var(--navy);
    font-size: 13px;
  }

  /* ══════════════════════════════
     월별 추진일정 페이지
  ══════════════════════════════ */
  .schedule-page {
    padding: 16px 22px 60px;
  }
  .schedule-page h3 {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 900;
    color: white;
    background: var(--navy);
    padding: 12px 16px;
    margin-bottom: 0;
    text-align: center;
    letter-spacing: 2px;
  }
  .schedule-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .schedule-table th {
    background: var(--navy-mid);
    color: var(--gold-light);
    padding: 8px 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    width: 60px;
  }
  .schedule-table td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border-light);
    color: var(--text-mid);
    line-height: 1.6;
    vertical-align: top;
  }
  .schedule-table tr:nth-child(even) td { background: var(--cream); }
  .schedule-table tr.highlight-row td { color: var(--navy); font-weight: 700; }
  .schedule-table tr.highlight-row th { background: var(--navy-light); }

  /* ══════════════════════════════
     발간정보 (뒷표지)
  ══════════════════════════════ */
  .back-cover {
    background: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 297mm;
    padding: 40px;
  }
  .back-cover .logo-large {
    width: 90px;
    height: 90px;
    margin-bottom: 20px;
  }
  .back-cover .province-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 24px;
    font-weight: 900;
    color: white;
    letter-spacing: 6px;
    margin-bottom: 40px;
  }
  .pub-info {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(200,168,75,0.3);
    padding: 20px 30px;
    width: 100%;
    max-width: 320px;
  }
  .pub-info h4 {
    font-size: 13px;
    color: var(--gold-light);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(200,168,75,0.3);
  }
  .pub-info dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 7px 12px;
    font-size: 12px;
  }
  .pub-info dt {
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
  }
  .pub-info dd {
    color: rgba(255,255,255,0.85);
    margin: 0;
  }
  .pub-info dd a {
    color: var(--gold-light);
    text-decoration: none;
  }

  /* ══════════════════════════════
     16개시군 마무리 페이지
  ══════════════════════════════ */
  .cities-page {
    background: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 297mm;
    padding: 0;
    overflow: hidden;
  }
  .cities-page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ══════════════════════════════
     갤러리 페이지
  ══════════════════════════════ */
  .gallery-page {
    background: white;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px 22px 60px;
  }
  .gallery-item {
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ─── 기사 링크 버튼 ─── */
  .art-links { margin-top: 10px; }
  .art-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #1a3557, #2d6a9f);
    border: none;
    padding: 7px 14px;
    text-decoration: none;
    border-radius: 20px;
    margin-right: 8px;
    margin-top: 10px;
    box-shadow: 0 2px 8px rgba(26,53,87,0.3);
    letter-spacing: 0.5px;
  }
  .art-link-btn:hover {
    background: linear-gradient(135deg, #c8a84b, #e8c96d);
    color: #1a3557;
  }

  /* ══════════════════════════════
     인쇄 설정
  ══════════════════════════════ */
  @media print {
    @page { size: A4; margin: 0; }
    body { background: white; margin: 0; padding: 0 !important; }
    #magazine { margin: 0; padding: 0; }
    .page {
      width: 210mm;
      height: 297mm;
      margin: 0;
      break-after: page;
      page-break-after: always;
      box-shadow: none;
      overflow: hidden;
    }
    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }
    .article {
      page-break-inside: avoid;
      break-inside: avoid;
      padding: 20px 0;
    }
    .art-photo {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .print-btn { display: none; }
  }

  /* 화면 미리보기 */
  @media screen {
    body { padding: 20px; }
    .page { overflow: hidden; min-height: auto; }
    .content-page { height: auto; min-height: auto; }
    .article { overflow: hidden; }
    .articles-inner { overflow: hidden; }
    .print-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--navy);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    .print-btn:hover { background: var(--navy-light); }
  }

  /* ══════════════════════════════
     모바일 반응형
  ══════════════════════════════ */
  @media screen and (max-width: 768px) {

    /* 모바일 PDF 버튼 숨김 */
    .print-btn { display: none !important; }

    /* 페이지 너비 */
    .page { width: 100%; min-height: auto; height: auto !important; }

    /* 2단 → 1단 변경 */
    .activity-with-img.img-right,
    .activity-with-img.img-left { grid-template-columns: 1fr; }
    .activity-with-img.img-left .activity-body  { order: 2; }
    .activity-with-img.img-left .activity-image { order: 1; }

    /* 사진 높이 */
    .activity-image img { height: 220px; }

    /* 글자 크기 */
    html { -webkit-text-size-adjust: 100%; }
    .activity-title-row h2       { font-size: 18px; }
    .activity-body p              { font-size: 13px; }
    .cover-headline-box .report-title { font-size: 26px; }
    .art-title   { font-size: 17px !important; }
    .art-body    { font-size: 13px !important; }
    .art-subtitle { font-size: 12px !important; }

    /* 여백 */
    .content-inner  { padding: 0 14px; overflow: visible; }
    .activity-block { padding: 14px 0; overflow: visible; min-height: auto; flex: none; }

    /* 푸터 겹침 */
    .page-footer { position: relative; margin-top: 20px; }

    /* 표지 */
    .cover-content { margin-top: 100px; }

    /* 본문 페이지 고정 높이 해제 */
    .content-page { height: auto; }
  }
</style>
</head>
<body>

<!-- 인쇄 버튼 (화면에서만 보임) -->
<button class="print-btn" onclick="handlePrint()">📥 PDF 저장</button>

<!-- 동적으로 생성됨 -->
<div id="magazine"></div>

<script>
function handlePrint() {
  if (navigator.userAgent.match(/iPhone|iPad|iPod|Android/i)) {
    alert('모바일에서는 브라우저 메뉴 → 공유 → PDF로 저장을 이용해 주세요.');
  } else {
    window.print();
  }
}

// ─── 데이터 파일 경로 ───
// 실제 사용 시 이 경로만 변경하면 됩니다
const DATA_FILE = 'data-2026-09.json?v=20260902';

// ─── 도트 색상 ───
const DOT_COLORS = ['#4caf50','#ffc107','#2196f3','#9c27b0','#ff5722','#00bcd4','#e91e63','#795548'];

// ─── 커버 파싱 (날짜 추출) ───
function parseCoverItem(item) {
  const match = item.match(/^(.*?)\s*(\(\d+\.\s*\d+(?:\s*\/\s*\d+\.\s*\d+)?\))$/);
  if (match) return { text: match[1].trim(), date: match[2] };
  return { text: item, date: '' };
}

// ─── 1면: 표지 ───
function buildCover(d) {
  const m = d.meta;
  const items = d.coverItems.map((item, i) => {
    const p = parseCoverItem(item);
    return `<li><span class="date-tag">${p.date}</span> ${p.text}</li>`;
  }).join('');

  return `<div class="page cover">
    <div class="cover-top">
      <div class="cover-logo"><img src="photos/logo.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div class="cover-top-titles">
        <div class="mag-label">MAGAZINE</div>
        <div class="cn-title">平南 猛虎出林</div>
        <div class="kr-sub">평안남도 도정보고 소식지</div>
      </div>
      <div class="cover-issue-badge">
        <div class="year-month">${m.year}.${m.issueMonth}</div>
      </div>
    </div>

    <div class="cover-hero">
      <div class="cover-content">
        <div class="cover-headline-box">
          <div class="report-label">📋 ${m.year}년 ${m.reportMonth}월 도정보고</div>
          <div class="report-title">${m.year}년 ${m.reportMonth}월<br>평남 도정보고</div>
          <div class="report-sub">${m.issueLabel}</div>
        </div>

        <div class="cover-toc-label">주요내용</div>
        <ul class="cover-toc-list">${items}</ul>
      </div>
    </div>
  </div>`;
}

// ─── 본문 페이지 빌더 ───
function buildActivityBlock(act, small) {
  const imgPos = act.imagePosition === 'left' ? 'img-left' : 'img-right';
  const logoStyle = act.isLogo ? 'style="object-fit: contain; object-position: center;"' : '';
  const imgHtml = `<div class="activity-image">
    <img src="${act.image}" alt="${act.title}" loading="lazy" ${logoStyle}>
    <div class="activity-image-caption">${act.title} (${act.date})</div>
  </div>`;
  const linksHtml = act.links && act.links.length
    ? `<div class="art-links">${act.links.map(l => `<a href="${l.url}" target="_blank" class="art-link-btn">🔗 ${l.title}</a>`).join('')}</div>`
    : '';
  const bodyHtml = `<div class="activity-body"><p>${act.body}</p>${linksHtml}</div>`;

  return `<div class="activity-block">
    <div class="activity-title-row">
      <h2>${act.title}<span class="date-inline">(${act.date})</span></h2>
      ${act.subtitle ? `<div class="activity-subtitle">${act.subtitle}</div>` : ''}
    </div>
    <div class="activity-with-img ${imgPos}">
      ${act.imagePosition === 'left' ? imgHtml + bodyHtml : bodyHtml + imgHtml}
    </div>
  </div>`;
}

function buildContentPage(activities, pageNum, meta, groupLabel) {
  const blocks = activities.map(a => buildActivityBlock(a)).join('');
  return `<div class="page content-page">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="photos/logo.png" style="width:36px;height:36px;object-fit:contain;">
        <div>
          <div class="title-cn">平南 猛虎出林</div>
          <div class="title-kr" style="font-size:12px; letter-spacing:1px; color:var(--navy-mid); margin-top:2px;">평안남도 도정보고 소식지</div>
        </div>
      </div>
      <div class="issue-info">
        MAGAZINE<br>${meta.year}.${meta.issueMonth}
      </div>
    </div>
    <div class="section-label">${groupLabel} 주요 실시사항</div>
    <div class="content-inner">${blocks}</div>
    <div class="page-footer">
      <span class="copyright">Copyright. 평안남도 도지사실</span>
      <span class="page-num">${pageNum}</span>
    </div>
  </div>`;
}

// ─── 예정사항 페이지 ───
function buildUpcomingPage(d, pageNum) {
  const m = d.meta;
  const upcoming = d.upcomingItems.map((item, i) => {
    // upcomingItems이 문자열인 경우 파싱
    let date = '', title = '';
    if (typeof item === 'string') {
      const match = item.match(/^(.*?)\s*\((\d+\.\s*\d+)\)$/);
      if (match) {
        title = match[1];
        date = match[2];
      } else {
        title = item;
        date = '';
      }
    } else {
      // 객체인 경우
      date = item.date || '';
      title = item.title || '';
    }

    return `
    <li>
      <span class="dot dot-${i % 5}"></span>
      <span class="udate">${date}</span>
      <span>${title}</span>
    </li>`;
  }).join('');

  const noticeLines = d.notice.lines.map((line, i) => {
    // URL을 클릭 가능한 링크로 변환
    const linked = line.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
    return `<li${i < 2 ? ' class="highlight"' : ''}>${linked}</li>`;
  }).join('');

  return `<div class="page content-page">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="photos/logo.png" style="width:36px;height:36px;object-fit:contain;">
        <div class="title-cn">平南 猛虎出林</div>
      </div>
      <div class="issue-info">MAGAZINE<br>${m.year}.${m.issueMonth}</div>
    </div>
    <div class="section-label">${m.reportMonth + 1}月 주요 예정사항</div>
    <div class="upcoming-section">
      <h3>${m.reportMonth + 1}월 주요 예정사항</h3>
      <ul class="upcoming-list">${upcoming}</ul>
    </div>

    <div class="notice-box">
      <div class="notice-box-header">${d.notice.icon} ${d.notice.title}</div>
      <div class="notice-box-body">
        <ul>${noticeLines}</ul>
        ${d.notice.qrImage ? `<div class="notice-box-qr"><img src="${d.notice.qrImage}" alt="QR코드"><span>설문 참여</span></div>` : ''}
      </div>
    </div>

    <div class="page-footer">
      <span class="copyright">Copyright. 평안남도 도지사실</span>
      <span class="page-num">${pageNum}</span>
    </div>
  </div>`;
}

// ─── 월별 추진일정 페이지 ───
function buildSchedulePage(d, pageNum) {
  const m = d.meta;
  const rows = d.schedule.map((row, i) => {
    const isCurrentMonth = (i + 1) === m.reportMonth;
    return `<tr${isCurrentMonth ? ' class="highlight-row"' : ''}>
      <th>${row.month}</th>
      <td>${row.items}</td>
    </tr>`;
  }).join('');

  return `<div class="page content-page">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="photos/logo.png" style="width:36px;height:36px;object-fit:contain;">
        <div class="title-cn">平南 猛虎出林</div>
      </div>
      <div class="issue-info">MAGAZINE<br>${m.year}.${m.issueMonth}</div>
    </div>
    <div class="schedule-page">
      <h3>${m.year}년 평안남도 월별 추진일정</h3>
      <table class="schedule-table">
        <colgroup><col width="60"><col></colgroup>
        <thead><tr><th>월</th><th>내 용</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="page-footer">
      <span class="copyright">Copyright. 평안남도 도지사실</span>
      <span class="page-num">${pageNum}</span>
    </div>
  </div>`;
}

// ─── 발간정보 (뒷표지) ───
function buildBackCover(d) {
  const m = d.meta;
  return `<div class="page back-cover">
    <div class="logo-large"><img src="photos/logo.png" style="width:100%;height:100%;object-fit:contain;"></div>
    <div class="province-name">평 안 남 도</div>
    <div class="pub-info">
      <h4>📋 발 간 정 보</h4>
      <dl>
        <dt>발간인</dt><dd>평안남도 도지사 ${m.governor}</dd>
        <dt>편집·기획</dt><dd>평안남도 비서실 정책보좌 ${m.editor.replace('평안남도 비서실 정책보좌 ', '')}</dd>
        <dt>연락처</dt><dd>${m.contact}</dd>
        <dt>이메일</dt><dd><a href="mailto:${m.email}">${m.email}</a></dd>
        <dt>홈페이지</dt><dd><a href="${m.homepage}">${m.homepage}</a></dd>
      </dl>
    </div>
  </div>`;
}

// ─── 갤러리 페이지 (한 많은 대동강) ───
async function buildGalleryPage(m) {
  const galleryPath = 'photos/2026-08/daedongang';
  let images = [];

  // 폴더에서 이미지 자동 로드 (01.jpg ~ 10.jpg)
  for (let i = 1; i <= 10; i++) {
    const num = String(i).padStart(2, '0');
    images.push(`${galleryPath}/${num}.jpg`);
  }

  const galleryItems = images.map((img, idx) => `
    <div class="gallery-item">
      <img src="${img}" alt="한 많은 대동강 ${idx + 1}">
    </div>
  `).join('');

  return `<div class="page content-page gallery-page">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="photos/logo.png" style="width:36px;height:36px;object-fit:contain;">
        <div>
          <div class="title-cn">平南 猛虎出林</div>
          <div class="title-kr" style="font-size:12px;">음악극 '한 많은 대동강' 무대 스케치</div>
        </div>
      </div>
      <div class="issue-info">MAGAZINE<br>${m.year}.${m.issueMonth}</div>
    </div>
    <div class="section-label">공연 장면</div>
    <div class="gallery-grid">${galleryItems}</div>
    <div class="page-footer">
      <span class="copyright">Copyright. 평안남도 도지사실</span>
      <span class="page-num">갤러리</span>
    </div>
  </div>`;
}

// ─── 16개시군 마무리 페이지 ───
function buildCitiesPage() {
  return `<div class="page cities-page">
    <img src="photos/16cities.png" alt="평안남도 16개시군">
  </div>`;
}

// ─── 전체 소식지 조립 ───
async function buildMagazine() {
  let data;
  try {
    const res = await fetch(DATA_FILE + '?v=' + Date.now());
    data = await res.json();
  } catch(e) {
    // fetch 실패시 (파일 직접 열기) 내장 샘플 사용
    console.warn('JSON fetch 실패 - 내장 데이터 사용:', e.message);
    data = INLINE_DATA;
  }

  const mag = document.getElementById('magazine');
  data.activities.sort((a, b) => (b.priority || 0) - (a.priority || 0));
  // 정렬 후 imagePosition 재할당 — 항상 right/left 번갈아가며 표시
  data.activities.forEach((a, i) => { a.imagePosition = i % 2 === 0 ? 'right' : 'left'; });
  const acts = data.activities;
  const m = data.meta;

  // 1면: 표지
  mag.innerHTML += buildCover(data);

  // 본문: 2개씩 묶어서 페이지 생성
  const pageSize = 3;
  let pageNum = 1;
  for (let i = 0; i < acts.length; i += pageSize) {
    const slice = acts.slice(i, i + pageSize);
    const label = `${m.reportMonth}月`;
    mag.innerHTML += buildContentPage(slice, `${pageNum}-${Math.ceil(acts.length/pageSize)}`, m, label);
    pageNum++;
  }

  // 예정사항 페이지
  mag.innerHTML += buildUpcomingPage(data, `예정`);

  // 갤러리 페이지 (8월호만)
  if (m.issueMonth === 8) {
    mag.innerHTML += await buildGalleryPage(m);
  }

  // 뒷표지
  mag.innerHTML += buildBackCover(data);

  // 16개시군 마무리 페이지
  mag.innerHTML += buildCitiesPage();
}

사는 을지훈련을 통해 평안남도 도정이 도민 안전을 최우선에 두고 철저한 비상 대비 태세를 갖춰나갈 것을 다짐했다.","priority":4,"image":"https://myungraekim.github.io/maengho/photos/2026-09/09_을지훈련_민방위_훈련.jpg","imagePosition":"right"},{"id":6,"title":"위원회 간담회","date":"8. 5","subtitle":"이북5도위원회 발전방안 토의","body":"정경조 평안남도지사는 8월 5일 오전 9시 30분 위원회 회의실에서 열린 간담회에 참석했다. 이날 간담회는 이북5도위원회의 발전방안을 토의하고 도정 현안과 주요 과제를 공유하는 자리로 마련되었다. 정경조 지사는 위원들과의 긴밀한 소통을 통해 도정 운영의 방향성을 점검하고 도민을 위한 실질적인 정책 실현에 더욱 힘쓸 것을 강조했다.","priority":3,"image":"https://myungraekim.github.io/maengho/photos/2026-09/06_위원회_간담회.jpg","imagePosition":"left"},{"id":7,"title":"『하나의 증언』 출판 기념회","date":"8. 15","subtitle":"분단의 기억, 기록으로 잇다","body":"정경조 평안남도지사는 8월 15일 오후 2시 5층 평화강당에서 열린 『하나의 증언』 출판 기념회에 참석했다. 광복절을 맞아 개최된 이날 행사는 분단의 아픔을 온몸으로 겪어 온 실향민들의 생생한 증언을 한 권의 책으로 엮어낸 뜻깊은 자리였다. 정경조 지사는 이 책이 실향민의 삶을 후대에 전하는 살아있는 기록이 되는 동시에 통일을 향한 염원을 이어가는 든든한 디딤돌이 될 것임을 강조했다.","priority":3,"image":"https://myungraekim.github.io/maengho/photos/2026-09/07_하나의_증언_출판_기념회.jpg","imagePosition":"right"},{"id":8,"title":"제6회 평안남도 한마음 볼링대회","date":"8. 22","subtitle":"도민 하나 되는 볼링 한마당","body":"정경조 평안남도지사는 8월 22일 오전 10시 30분 KBS스포츠월드 볼링센터에서 열린 '제6회 평안남도 한마음 볼링대회'에 참석했다. 이번 대회는 평안남도 출신 도민과 실향민 가족들이 한자리에 모여 친선을 다지는 뜻깊은 자리로 마련되었다. 정경조 지사는 이날 도민들과 직접 어울리며 평안남도 공동체의 결속을 이어가고 고향에 대한 긍지를 다음 세대에 전승해 나가겠다는 뜻을 밝혔다.","priority":3,"image":"https://myungraekim.github.io/maengho/photos/2026-09/08_제6회_평안남도_한마음_볼링.jpg","imagePosition":"left"},{"id":12,"title":"평남 수건춤 이수자 이수증 수여식","date":"8. 31","subtitle":"전통문화 이수자 배출","body":"정경조 평안남도지사는 8월 31일 오후 2시 소회의실에서 열린 평남 수건춤 이수자 이수증 수여식에 참석했다. 이날 행사는 평안남도의 전통 춤인 수건춤을 계승하고 발전시키기 위해 이수한 인사들에게 이수증을 수여하는 뜻깊은 자리였다. 정경조 지사는 전통문화 이수자들의 노고를 치하하며 평안남도의 무형유산 보존에 앞장설 것을 격려했다.","priority":3,"image":"https://myungraekim.github.io/maengho/photos/2026-09/12_평남_수건춤_이수자_이수증.jpg","imagePosition":"left"},{"id":10,"title":"『노무현 평전』 출간기념회","date":"8. 18","subtitle":"정치와 도덕을 말하다","body":"정경조 평안남도지사는 8월 18일 오후 6시 노무현시민센터에서 열린 『노무현 평전』 출간기념회에 참석했다. 이 행사는 전직 대통령 노무현 전 대통령의 삶과 정치철학을 조명하는 뜻깊은 자리로 마련되었다. 정경조 지사는 지난 시대의 정치적 유산과 도덕적 가치를 되새기며 평안남도의 발전과 도민의 화합을 위해 노력할 것을 강조했다.","priority":2,"image":"https://myungraekim.github.io/maengho/photos/2026-09/10_노무현_평전_출간기념회.jpg","imagePosition":"left"},{"id":11,"title":"평양검무보존회 인터뷰","date":"8. 29","subtitle":"북한 문화유산을 지키다","body":"정경조 평안남도지사는 8월 29일 오후 2시 30분 도지사실에서 평양검무보존회와 인터뷰를 진행했다. 평양검무는 평안남도의 전통 춤으로 북한 문화유산을 대표하는 예술이다. 정경조 지사는 전통문화 보존의 중요성을 강조하고 평안남도의 무형유산 발굴과 이수자 육성을 위한 도정의 노력을 약속했다.","priority":2,"image":"https://myungraekim.github.io/maengho/photos/2026-09/11_평양검무보존회_인터뷰.jpg","imagePosition":"right"},{"id":4,"title":"행정자문위원 회의","date":"8. 5","subtitle":"행정자문위원 회의 개최","body":"정경조 평안남도지사는 8월 5일 오전 11시 소회의실에서 열린 행정자문위원 회의에 참석했다. 이날 회의는 평안남도 도정 현안에 대한 자문위원들의 의견을 청취하고 향후 행정 방향을 점검하는 자리로 마련되었다. 각 분야 전문가로 구성된 자문위원들은 도정 운영 전반에 걸쳐 다양한 의견과 제언을 제시하였으며, 활발한 논의가 이어졌다.","priority":1,"image":"https://myungraekim.github.io/maengho/photos/2026-09/04_행정자문위원_회의.jpg","imagePosition":"left"},{"id":5,"title":"간사읍·면·동장회의","date":"8. 8","subtitle":"간사 읍면동장회의 개최","body":"정경조 평안남도지사는 8월 8일 오전 11시 도지사실에서 열린 간사 읍·면·동장회의에 자리했다. 이번 회의는 도내 각 읍·면·동 간사들이 한자리에 모여 현안을 점검하고 행정 소통을 강화하는 자리로 마련되었다. 평안남도는 실향민의 고향에 대한 염원을 이어가는 동시에 도정 전반의 내실을 다지기 위해 일선 행정 조직과의 긴밀한 협력을 지속해 나가고 있다.","priority":1,"image":"https://myungraekim.github.io/maengho/photos/2026-09/05_간사읍_면_동장회의.jpg","imagePosition":"right"}],"upcomingItems":[],"notice":{"title":"주요 공지사항","icon":"📌","lines":["(공지사항을 직접 입력하세요)"]},"schedule":[{"month":"1월","items":"신년하례 / 국립현충원참배 / 읍·면·동장위촉식 / 행정자문위원회의 / 이북도민 실태조사 및 생활지원(연중)"},{"month":"2월","items":"통일원로회의 / 시장·군수월례회의(매월3주차 금요일)"},{"month":"3월","items":"읍면동장회의 / 시도사무소장회의 / 사회통합교육(반기1회) / 명예 도민증수여(분기1회)"},{"month":"4월","items":"정부포상추천 및 심사 방법 개선방안 토의 / 고향 찾아주기 프로그램 발전 / 행정자문위원회의"},{"month":"5월","items":"도민의 날 / 평안남도 명문가 찾기 / 원자력발전소견학(변동가능) / 3세가 찾아가는 뿌리 찾기 / 통일원로회의"},{"month":"6월","items":"국외이북도민 고국방문단 초청행사(6.22~26) / 명예 도민증 수여 / 시도사무소장 순회회의 / 6.25참전용사 감사·위안행사"},{"month":"7월","items":"제3회 북한이탈주민의 날 / 행정자문위원회의 / 한 많은 대동강 뮤지컬 공연"},{"month":"8월","items":
